    <header style="display: flex; align-items: center; justify-content: space-between; height: 44px">

      <div style="display: flex; gap: 8px">
        <button type="button" aria-label="Mais opções do treino" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #211F1C; color: #F2EFE8; display: flex; align-items: center; justify-content: center">

        <span style="border-radius: 1px; background: #2B2925"></span>
        <span style="border-radius: 1px; background: #2B2925"></span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; padding: 16px 16px 16px; border-radius: 14px; background: #171614; overflow: hidden">
      <div style="display: flex; align-items: flex-start; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h2 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.1">Agachamento</h2>
          <span style="font-size: 13px; color: #9C978E">Alvo 150 kg a RPE 8, 82% do e1RM</span>
        </div>
        <button type="button" aria-label="Opções do exercício" style="width: 40px; height: 40px; border: 0; background: transparent; color: #9C978E; display: flex; align-items: center; justify-content: center">

        </button>
      </div>

      <div style="display: grid; grid-template-columns: 36px 60px minmax(0, 1fr) minmax(0, 1fr) 44px 44px; gap: 6px; align-items: center; height: 30px; margin-top: 10px; font-size: 11px; font-weight: 600; color: #87827B">

        <span style="text-align: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 21px; color: #9C978E">5</span>
        <span></span>
        <button type="button" aria-label="Série concluída" style="width: 38px; height: 38px; justify-self: center; border: 0; border-radius: 8px; background: #2B2925; color: #F2EFE8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M20 6 9 17l-5-5"></path></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: 36px 60px minmax(0, 1fr) minmax(0, 1fr) 44px 44px; gap: 6px; align-items: center; height: 46px; border-top: 1px solid #26231F">
        <span style="font-size: 12px; font-weight: 700; color: #87827B">Aq</span>
        <span style="font-size: 12px; color: #87827B">100 × 3</span>
        <span style="text-align: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 21px; font-variant-numeric: tabular-nums; color: #9C978E">100</span>
        <span style="text-align: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 21px; color: #9C978E">3</span>
        <span></span>
        <button type="button" aria-label="Série concluída" style="width: 38px; height: 38px; justify-self: center; border: 0; border-radius: 8px; background: #2B2925; color: #F2EFE8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M20 6 9 17l-5-5"></path></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: 36px 60px minmax(0, 1fr) minmax(0, 1fr) 44px 44px; gap: 6px; align-items: center; height: 46px; border-top: 1px solid #26231F">
        <span style="font-size: 12px; font-weight: 700; color: #87827B">Aq</span>

        <span style="font-size: 12px; color: #9C978E">147,5 × 4</span>
        <span style="text-align: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 23px; font-variant-numeric: tabular-nums">150</span>

      </div>

      <div style="display: grid; grid-template-columns: 36px 60px minmax(0, 1fr) minmax(0, 1fr) 44px 44px; gap: 6px; align-items: center; height: 48px">
        <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 19px; color: #87827B">4</span>
        <span style="font-size: 12px; color: #87827B">147,5 × 3</span>
        <span style="text-align: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 23px; color: #6B665F">150</span>
        <span style="text-align: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 23px; color: #6B665F">4</span>

      <button type="button" style="height: 44px; margin-top: 6px; border: 0; border-radius: 10px; background: #211F1C; color: #9C978E; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>

    <section style="display: flex; flex-direction: column; padding: 14px 16px 4px; border-radius: 14px; background: #171614">
