# Headers de segurança — definidos UMA vez e incluídos no server e em cada location.
#
# Por que o include: `add_header` dentro de um location SUBSTITUI (não soma) os
# headers herdados do server. Todo location que adiciona um header próprio precisa
# reincluir este arquivo, senão perde os headers de segurança. Antes esta lista
# estava copiada em 4 lugares no nginx.conf, o que garantia drift na primeira edição.
#
# __API_ORIGIN__ é substituído no build (Dockerfile) pelo valor de VITE_API_URL — a
# mesma origem que o bundle usa para chamar a API. Assim a CSP não pode divergir da
# URL que o frontend realmente chama.

add_header X-Content-Type-Options    "nosniff"                                  always;
add_header X-Frame-Options           "DENY"                                     always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"          always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

# HSTS: o nginx fica atrás do TLS do Traefik em produção; ignorado por browsers em HTTP dev.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"      always;

# CSP. Origens externas e por que cada uma é necessária:
#   __API_ORIGIN__                        connect-src — chamadas de auth/sync do frontend
#   https://accounts.google.com/gsi/*     login com Google (script, iframe, fetch e estilo do GSI)
#   https://fonts.googleapis.com/gstatic  webfonts
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; worker-src 'self'; connect-src 'self' __API_ORIGIN__ https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'" always;
