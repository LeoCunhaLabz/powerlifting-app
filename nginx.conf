# Migração de domínio (issue #291): o subdomínio antigo redireciona para o host
# canônico do app. O Traefik termina TLS para todos esses hosts, por isso o redirect
# pode (e deve) apontar direto para https.
server {
    listen 8080;
    server_name treino.cunhalabs.tech;
    return 301 https://app.onyxtreino.com.br$request_uri;
}

# www → apex da landing (issue #250). Um único host canônico para o SEO.
server {
    listen 8080;
    server_name www.onyxtreino.com.br;
    return 301 https://onyxtreino.com.br$request_uri;
}

# LANDING PAGE (issue #250): HTML estático do Astro (apps/landing) na raiz do domínio.
# Vive no mesmo container do app (mesma imagem, mesmo deploy) — o Traefik já roteava a
# raiz para este serviço desde a #291. Headers/CSP separados do app (arquivo próprio).
server {
    listen 8080;
    server_name onyxtreino.com.br;
    root /usr/share/nginx/landing;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    include /etc/nginx/landing-security-headers.conf;

    # Assets com hash no nome (Astro emite em /_astro/): cache longo e imutável.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        include /etc/nginx/landing-security-headers.conf;
    }

    # Ícones/imagens sem hash (favicon, og-image, logo): cache curto para poder trocar.
    location ~* \.(ico|png|svg|jpg|jpeg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        include /etc/nginx/landing-security-headers.conf;
    }

    location = /robots.txt {
        try_files $uri =404;
        include /etc/nginx/landing-security-headers.conf;
    }

    # sitemap-index.xml e sitemap-0.xml gerados pelo @astrojs/sitemap.
    location ~ ^/sitemap[^/]*\.xml$ {
        types { }
        default_type application/xml;
        try_files $uri =404;
        include /etc/nginx/landing-security-headers.conf;
    }

    # Sondas de scanner e dot-paths: 404 real (mesma lógica do host do app).
    location ~* \.(txt|json|map|config|ya?ml|env|sql|bak)$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    # URLs limpas sem barra final: o Astro gera /calculadoras/dots.html
    # (build.format: 'file'); `$uri.html` resolve. `$uri/index.html` cobre a raiz
    # (`/`) sem o redirect 301 que `$uri/` provocaria. Sem fallback de SPA — página
    # inexistente devolve o 404.html do Astro com status 404.
    error_page 404 /404.html;
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/landing-security-headers.conf;
        try_files $uri $uri.html $uri/index.html =404;
    }
}

server {
    # 8080: o container roda como usuário não-root (nginx), que não pode fazer bind
    # em portas < 1024. Traefik (produção) e docker-compose (local) falam com esta porta.
    # default_server: localhost/docker-compose e o smoke test continuam caindo aqui,
    # qualquer que seja o Host — só os hosts do bloco de redirect acima são desviados.
    listen 8080 default_server;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/xml+rss image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # PWA: service worker e manifest — sem cache para detectar atualizações
    location ~* (sw\.js|workbox-[^.]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(js|css|woff2|woff|ttf|ico|png|jpg|jpeg|gif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    # Arquivos de crawler: vêm de apps/web/public/ e são servidos de verdade, com o
    # content-type correto. Match exato (`=`) tem prioridade sobre os regex abaixo,
    # então nunca caem no 404 por extensão nem no fallback de SPA.
    location = /robots.txt {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    location = /sitemap.xml {
        # `types { }` zera o mime map do location para forçar application/xml
        # (o mime.types do nginx mapeia .xml para text/xml).
        types { }
        default_type application/xml;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    # Paths com extensão que não existem no build devolvem 404 real, em vez de cair
    # no fallback de SPA e responder "200 text/html" com o index.html. Um robots.txt
    # ausente respondido como HTML tem comportamento indefinido entre crawlers.
    location ~* \.(txt|xml|json|map|config|ya?ml|env|sql|bak)$ {
        return 404;
    }

    # Dot-paths de ferramentas (.git, .env, .svn): 404 em vez de 200 com HTML — não há
    # vazamento (nada disso vai para a imagem), mas responder 200 a sondas de scanner
    # faz o host parecer vulnerável e atrai mais varredura. .well-known fica de fora.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Fallback de SPA: paths sem extensão (deep links) carregam o app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
