# Migração de domínio (issue #291): o subdomínio antigo e a raiz do domínio novo
# redirecionam para o host canônico do app. A raiz (onyxtreino.com.br) é TEMPORÁRIA
# aqui — quando a landing page (#250) existir, ela passa a ser servida na raiz e
# este server_name sai deste bloco. O Traefik termina TLS para todos esses hosts,
# por isso o redirect pode (e deve) apontar direto para https.
server {
    listen 8080;
    server_name treino.cunhalabs.tech onyxtreino.com.br www.onyxtreino.com.br;
    return 301 https://app.onyxtreino.com.br$request_uri;
}

server {
    # 8080: o container roda como usuário não-root (nginx), que não pode fazer bind
    # em portas < 1024. Traefik (produção) e docker-compose (local) falam com esta porta.
    # default_server: localhost/docker-compose e o smoke test continuam caindo aqui,
    # qualquer que seja o Host — só os hosts do bloco de redirect acima são desviados.
    listen 8080 default_server;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/xml+rss image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # PWA: service worker e manifest — sem cache para detectar atualizações
    location ~* (sw\.js|workbox-[^.]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(js|css|woff2|woff|ttf|ico|png|jpg|jpeg|gif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    # Arquivos de crawler: vêm de apps/web/public/ e são servidos de verdade, com o
    # content-type correto. Match exato (`=`) tem prioridade sobre os regex abaixo,
    # então nunca caem no 404 por extensão nem no fallback de SPA.
    location = /robots.txt {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    location = /sitemap.xml {
        # `types { }` zera o mime map do location para forçar application/xml
        # (o mime.types do nginx mapeia .xml para text/xml).
        types { }
        default_type application/xml;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    # Paths com extensão que não existem no build devolvem 404 real, em vez de cair
    # no fallback de SPA e responder "200 text/html" com o index.html. Um robots.txt
    # ausente respondido como HTML tem comportamento indefinido entre crawlers.
    location ~* \.(txt|xml|json|map|config|ya?ml|env|sql|bak)$ {
        return 404;
    }

    # Dot-paths de ferramentas (.git, .env, .svn): 404 em vez de 200 com HTML — não há
    # vazamento (nada disso vai para a imagem), mas responder 200 a sondas de scanner
    # faz o host parecer vulnerável e atrai mais varredura. .well-known fica de fora.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Fallback de SPA: paths sem extensão (deep links) carregam o app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
