# Headers de segurança do host da LANDING (onyxtreino.com.br) — issue #250.
#
# Separado do nginx-security-headers.conf (host do app) porque a landing não fala com a
# API nem com o Google Identity: a política dela é mais restrita. Mesma regra do outro
# arquivo: `add_header` num location SUBSTITUI os herdados, então todo location com
# add_header próprio precisa reincluir este snippet.

add_header X-Content-Type-Options    "nosniff"                                  always;
add_header X-Frame-Options           "DENY"                                     always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"          always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"      always;

# CSP da landing. Origens externas e por que cada uma existe:
#   https://fonts.googleapis.com / gstatic   webfonts (Outfit + Plus Jakarta Sans)
#   https://stats.onyxtreino.com.br          Umami (#290): script.js e envio via /api/send
# 'unsafe-inline' em script-src e style-src é deliberado: o Astro hidrata as ilhas com
# 3 <script> inline próprios (mudam a cada versão do Astro — hash fixo aqui quebraria em
# upgrade) e o HTML estático usa `style="…"` (frames de celular, ilhas React). A
# alternativa nativa (`experimental.csp` do Astro, hashes em <meta>) foi testada e
# descartada: ela injeta hash em style-src, o que faz o browser ignorar 'unsafe-inline'
# e bloquear todo style inline. A landing não tem login, dados de usuário nem
# conteúdo dinâmico, então a superfície de XSS é o próprio HTML versionado no repo.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://stats.onyxtreino.com.br; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://stats.onyxtreino.com.br; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
